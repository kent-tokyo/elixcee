[package]
name = "elixcee-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kent-tokyo/elixcee"
homepage = "https://github.com/kent-tokyo/elixcee"
documentation = "https://docs.rs/elixcee-wasm"
description = "wasm-bindgen bridge for bounded XLSX reading, formula calculation, diagnostics, and stateful workbook editing"
keywords = ["excel", "xlsx", "spreadsheet", "wasm", "webassembly"]
categories = ["wasm", "parser-implementations"]
readme = "README.md"

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
elixcee = { path = "../..", version = "1.0.12" }
wasm-bindgen = "0.2"
