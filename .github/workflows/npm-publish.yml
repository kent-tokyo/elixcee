name: Publish @elixcee/xlsx to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'xlsx-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/xlsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/xlsx/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:no-dom
      - run: npm run audit:pack
      - run: npm run wasm:smoke
      - run: npm run pack:consumer
      - run: npm run browser:smoke
      - name: Check whether this immutable version is already published
        id: registry
        shell: bash
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --access public --provenance
