name: Publish to crates.io

# Deliberately workflow_dispatch only, not triggered by v* tags. Published
# crates can be yanked but never deleted, and the WASM bridge must follow the
# matching native `elixcee` release in the crates.io index.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to publish from (e.g. v1.0.12)"
        required: true
        default: "v1.0.12"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # elixcee-types has no dependency on elixcee, so it can publish standalone.
      # Idempotent across releases: elixcee-types changes far less often than
      # elixcee itself (current root releases reuse elixcee-types 0.4.1),
      # so most runs of this workflow should skip this step rather than fail
      # on crates.io's "already uploaded" error for a version already live.
      - name: cargo publish -p elixcee-types (skips if this version is already live)
        id: types
        run: |
          VERSION=$(grep -m1 '^version' crates/elixcee-types/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf -H "User-Agent: elixcee-ci (https://github.com/kent-tokyo/elixcee)" \
               "https://crates.io/api/v1/crates/elixcee-types/$VERSION" -o /dev/null; then
            echo "elixcee-types $VERSION is already published, skipping"
          else
            cargo publish -p elixcee-types
          fi

      # elixcee's own dependency on elixcee-types is version-pinned (not
      # path-only) for publishing, so it needs the crates.io index to have
      # picked up the elixcee-types upload before it can resolve it. crates.io's
      # API rejects requests with no identifying User-Agent (data-access
      # policy), so this sends one rather than getting a spurious 403.
      - name: wait for elixcee-types to appear in the crates.io index
        run: |
          VERSION="${{ steps.types.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -sf -H "User-Agent: elixcee-ci (https://github.com/kent-tokyo/elixcee)" \
                 "https://crates.io/api/v1/crates/elixcee-types/$VERSION" -o /dev/null; then
              echo "elixcee-types $VERSION is live on crates.io"
              exit 0
            fi
            echo "not yet indexed, waiting (attempt $i/30)..."
            sleep 10
          done
          echo "::error::elixcee-types $VERSION never appeared in the crates.io index after 5 minutes"
          exit 1

      - name: pin the published elixcee-types patch release
        run: cargo update -p elixcee-types --precise "${{ steps.types.outputs.version }}"

      - name: cargo publish -p elixcee
        run: cargo publish -p elixcee

      - name: wait for elixcee to appear in the index
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          for i in $(seq 1 30); do
            if curl -sf -H "User-Agent: elixcee-ci (https://github.com/kent-tokyo/elixcee)" \
                 "https://crates.io/api/v1/crates/elixcee/$VERSION" -o /dev/null; then
              echo "elixcee $VERSION is live on crates.io"
              exit 0
            fi
            echo "not yet indexed, waiting (attempt $i/30)..."
            sleep 10
          done
          echo "::error::elixcee $VERSION never appeared in the crates.io index after 5 minutes"
          exit 1

      # This ordering is required: the crate calls APIs from the matching
      # public elixcee release and cannot be verified against an older index.
      - name: cargo publish -p elixcee-wasm
        run: cargo publish -p elixcee-wasm
