name = "run_class_collection_integration"
command = "run"
files = ["""
Attribute VB_Name = "MainModule"
Sub Main()
    Set counter = New Counter
    Call counter.Add(2)
    Set items = New Collection
    Call items.Add(counter, "counter")
    Set counter = Nothing
    With items.Item("COUNTER")
        .Add 3
        Cells(1, 1).Value = .Current()
    End With
End Sub
""", """
VERSION 1.0 CLASS
BEGIN
  MultiUse = -1
END
Attribute VB_Name = "Counter"
Private total As Long
Private Sub Class_Initialize()
    total = 10
End Sub
Public Sub Add(value)
    total = total + value
End Sub
Public Function Current()
    Current = total
End Function
"""]
args = ["Main"]
expect_exit_code = 0
expect_json = """
{"schema_version":1,"ok":true,"entrypoint":"Main","cells":[{"sheet":"sheet1","address":"A1","value":15}],"messages":[]}
"""
